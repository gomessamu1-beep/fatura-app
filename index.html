      return h('img', { src: `https://cdn.svgs.dev/logos/${banco.slug}.svg`, alt: banco.name, style: { width: size, height: size, objectFit: 'contain', borderRadius: 3 }, onError: (e) => { e.target.style.display = 'none'; } });

    function splitInstallments(total, n) {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      let remainder = totalCents - base * n;
      const result = [];
      for (let i = 0; i < n; i++) {
        let val = base;
        if (remainder > 0) { val += 1; remainder -= 1; }
        result.push(val / 100);
      }
      return result;
    }

    function addMonths(yyyymm, delta) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthDiff(fromYYYYMM, toYYYYMM) {
      const f = fromYYYYMM.split("-").map(Number);
      const t = toYYYYMM.split("-").map(Number);
      return (t[0] - f[0]) * 12 + (t[1] - f[1]);
    }

    function formatMonthLabel(yyyymm) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, 1);
      const label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function formatDateBR(dateString) {
      if (!dateString) return "";
      const parts = dateString.split("-");
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatBRL(v) { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function currentMonth() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
    function currentDate() { const d = new Date(); return d.toISOString().split('T')[0]; }

      const cleaned = raw.toString().replace(/\./g, "").replace(",", ".").replace(/[^\d.]/g, "");

          setCartoes(prev => prev.filter(c => c.id !== id));

                  h('label', { style: { fontSize: '12px', fontWeight: 'bold' } }, "Conta Bancária"),
                  h('select', { value: concilContaId, onChange: e => setConcilContaId(e.target.value), style: { padding: '8px', borderRadius: '4px', border: '1px solid #ccc' } },
                    h('option', { value: '' }, "Selecione a conta..."),
                    contasBancarias.map(c => h('option', { key: c.id, value: c.id }, c.nome))
                  )
                ),
                h('div', { style: { display: 'flex', flexDirection: 'column', gap: '5px' } },
                  h('label', { style: { fontSize: '12px', fontWeight: 'bold' } }, "Data Inicial"),
                  h('input', { type: 'date', value: concilDataIni, onChange: e => setConcilDataIni(e.target.value), style: { padding: '8px', borderRadius: '4px', border: '1px solid #ccc' } })
                ),
                h('div', { style: { display: 'flex', flexDirection: 'column', gap: '5px' } },
                  h('label', { style: { fontSize: '12px', fontWeight: 'bold' } }, "Data Final"),
                  h('input', { type: 'date', value: concilDataFim, onChange: e => setConcilDataFim(e.target.value), style: { padding: '8px', borderRadius: '4px', border: '1px solid #ccc' } })
                )
              ),
              h('div', { style: { display: 'flex', gap: '10px', alignItems: 'center' } },
                h('input', { type: 'file', accept: '.ofx', ref: ofxInputRef, onChange: handleOfxUpload, style: { display: 'none' } }),
                h('button', { onClick: () => ofxInputRef.current.click(), style: { padding: '10px 20px', background: '#2980B9', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold' } }, "Importar Arquivo OFX"),
                h('button', { onClick: () => setConcilExibido(true), style: { padding: '10px 20px', background: '#27AE60', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold' } }, "Processar Conciliação")
              )
            )
          )
        ),

        // --- MODAIS GLOBAIS ---
        
        // Modal: Editar Subcategoria
        editSubcategoriaModal.open && h('div', { style: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 } },
          h('div', { onClick: e => e.stopPropagation(), style: { background: 'white', padding: '24px', borderRadius: '8px', width: '100%', maxWidth: '380px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)' } },
            h('div', { style: { fontSize: 16, fontWeight: 'bold', marginBottom: 16 } }, "Editar Subcategoria"),
            h('form', { onSubmit: handleSaveEditSubcategoria, style: { display: 'flex', flexDirection: 'column', gap: 12 } },
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } }, 
                h('label', { style: { fontSize: '14px', fontWeight: 'bold' } }, "Nome da Subcategoria *"), 
                h('input', { type: 'text', value: editSubcategoriaModal.nome, onChange: e => setEditSubcategoriaModal({ ...editSubcategoriaModal, nome: e.target.value }), required: true, style: { padding: '8px', borderRadius: '4px', border: '1px solid #ccc' } })
              ),
              h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 10 } }, 
                h('button', { type: 'button', onClick: () => setEditSubcategoriaModal({ open: false, catId: null, subId: null, nome: "" }), style: { padding: '8px 16px', border: '1px solid #ccc', borderRadius: '4px', cursor: 'pointer', background: '#fff' } }, "Cancelar"), 
                h('button', { type: 'submit', style: { padding: '8px 16px', border: 'none', borderRadius: '4px', cursor: 'pointer', background: '#2980B9', color: 'white', fontWeight: 'bold' } }, "Salvar")
              )
            )
          )
        ),

        // Modal: Exclusão em Lote
        batchDeleteModalOpen && h('div', { style: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 } },
          h('div', { onClick: e => e.stopPropagation(), style: { background: 'white', padding: '24px', borderRadius: '8px', width: '100%', maxWidth: '400px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)' } },
            h('div', { style: { fontSize: 18, fontWeight: 'bold', marginBottom: 12, color: '#E74C3C' } }, "Atenção: Exclusão em Lote"),
            h('div', { style: { fontSize: 14, marginBottom: 16, lineHeight: '1.5' } }, `Você está prestes a excluir vários lançamentos selecionados. Esta ação não pode ser desfeita.`),
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px', marginBottom: 16 } }, 
              h('label', { style: { fontSize: '14px', fontWeight: 'bold' } }, "Digite EXCLUIR para confirmar:"), 
              h('input', { type: 'text', value: batchConfirmText, onChange: e => setBatchConfirmText(e.target.value), required: true, style: { padding: '8px', borderRadius: '4px', border: '1px solid #ccc' } })
            ),
            h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8 } }, 
              h('button', { type: 'button', onClick: () => { setBatchDeleteModalOpen(false); setBatchConfirmText(""); }, style: { padding: '8px 16px', border: '1px solid #ccc', borderRadius: '4px', cursor: 'pointer', background: '#fff' } }, "Cancelar"), 
              h('button', { type: 'button', onClick: handleBatchDeleteConfirm, style: { padding: '8px 16px', border: 'none', borderRadius: '4px', cursor: 'pointer', background: '#E74C3C', color: 'white', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '6px' } }, h(Trash2, { size: 14 }), "Confirmar Exclusão")
            )
          )
        ),

        // Modal: Exclusão Individual (Delete Modal)
        deleteModal.open && h('div', { style: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 } },
          h('div', { onClick: e => e.stopPropagation(), style: { background: 'white', padding: '24px', borderRadius: '8px', width: '100%', maxWidth: '400px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)' } },
            h('div', { style: { fontSize: 18, fontWeight: 'bold', marginBottom: 12, color: '#E74C3C' } }, deleteModal.title),
            h('div', { style: { fontSize: 14, marginBottom: 16, lineHeight: '1.5' } }, deleteModal.message),
            
            // Opções extras se for um lançamento recorrente
            (deleteModal.type === 'purchase' || deleteModal.type === 'pagar' || deleteModal.type === 'receber') && deleteModal.purchase && deleteModal.purchase.recorrente && h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 20, background: '#F8F9FA', padding: '12px', borderRadius: '4px' } },
              h('label', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: '14px' } }, 
                h('input', { type: 'radio', name: 'deleteOption', checked: deleteModal.option === 'current', onChange: () => setDeleteModal({ ...deleteModal, option: 'current' }) }), "Excluir apenas deste mês"
              ),
              h('label', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: '14px' } }, 
                h('input', { type: 'radio', name: 'deleteOption', checked: deleteModal.option === 'future', onChange: () => setDeleteModal({ ...deleteModal, option: 'future' }) }), "Excluir deste mês em diante"
              ),
              h('label', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: '14px' } }, 
                h('input', { type: 'radio', name: 'deleteOption', checked: deleteModal.option === 'all', onChange: () => setDeleteModal({ ...deleteModal, option: 'all' }) }), "Excluir todas as recorrências"
              )
            ),
            
            h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8 } }, 
              h('button', { type: 'button', onClick: () => setDeleteModal({ open: false, type: null, id: null, subId: null, purchase: null, title: "", message: "", option: "all" }), style: { padding: '8px 16px', border: '1px solid #ccc', borderRadius: '4px', cursor: 'pointer', background: '#fff' } }, "Cancelar"), 
              h('button', { type: 'button', onClick: handleConfirmDelete, style: { padding: '8px 16px', border: 'none', borderRadius: '4px', cursor: 'pointer', background: '#E74C3C', color: 'white', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '6px' } }, h(Trash2, { size: 14 }), "Excluir")
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(FaturaApp));
  </script>
</body>
</html>

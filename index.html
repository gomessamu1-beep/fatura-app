    function splitInstallments(total, n) {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      let remainder = totalCents - base * n;
      const result = [];
      for (let i = 0; i < n; i++) {
        let val = base;
        if (remainder > 0) { val += 1; remainder -= 1; }
        result.push(val / 100);
      }
      return result;
    }

    function addMonths(yyyymm, delta) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthDiff(fromYYYYMM, toYYYYMM) {
      const f = fromYYYYMM.split("-").map(Number);
      const t = toYYYYMM.split("-").map(Number);
      return (t[0] - f[0]) * 12 + (t[1] - f[1]);
    }

    function formatMonthLabel(yyyymm) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, 1);
      const label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function formatDateBR(dateString) {
      if (!dateString) return "";
      const parts = dateString.split("-");
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatBRL(v) {
      return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    function parseValorInput(raw) {

      function handleProcessarTxtCategorias(e) {
        e.preventDefault();
        const linhas = txtCategoriasContent.split("\n");
        if (linhas.length === 0 || !txtCategoriasContent.trim()) {
          alert("Cole ou carregue um arquivo TXT válido.");
          return;
        }

        let novasCategorias = [...categorias];
        let catAtual = null;
        let qtdCatAdicionadas = 0;
        let qtdSubAdicionadas = 0;

        linhas.forEach(linhaOriginal => {
          const temTabulacao = linhaOriginal.startsWith("\t") || linhaOriginal.startsWith("    ");
          const limpa = linhaOriginal.trim();
          if (!limpa) return;

          const ehSub = temTabulacao || limpa.startsWith("-") || limpa.startsWith("•");
          const nomeItem = limpa.replace(/^[-•]\s*/, "").trim();

          if (!ehSub) {
            let catExistente = novasCategorias.find(c => c.tipo === categoriaTipoTab && c.nome.toLowerCase() === nomeItem.toLowerCase());
            if (!catExistente) {
              catExistente = {
                id: uid(),
                tipo: categoriaTipoTab,
                nome: nomeItem,
                cor: CARD_COLORS[novasCategorias.length % CARD_COLORS.length],
                subcategorias: []
              };
              novasCategorias.push(catExistente);
              qtdCatAdicionadas++;
            }
            catAtual = catExistente;
          } else {
            if (catAtual) {
              let subExistente = catAtual.subcategorias.find(s => s.nome.toLowerCase() === nomeItem.toLowerCase());
              if (!subExistente) {
                catAtual.subcategorias.push({ id: uid(), nome: nomeItem });
                qtdSubAdicionadas++;
              }
            } else {
              const catsDoTipo = novasCategorias.filter(c => c.tipo === categoriaTipoTab);
              if (catsDoTipo.length > 0) {
                catAtual = catsDoTipo[catsDoTipo.length - 1];
                let subExistente = catAtual.subcategorias.find(s => s.nome.toLowerCase() === nomeItem.toLowerCase());
                if (!subExistente) {
                  catAtual.subcategorias.push({ id: uid(), nome: nomeItem });
                  qtdSubAdicionadas++;
                }
              }
            }
          }
        });

        updateCategorias(novasCategorias);
        setTxtCategoriasContent("");
        alert(`Importação concluída (${categoriaTipoTab === 'despesa' ? 'Despesas' : 'Receitas'})!\n- ${qtdCatAdicionadas} nova(s) categoria(s) adicionada(s).\n- ${qtdSubAdicionadas} nova(s) subcategoria(s) adicionada(s).`);
      }

        else if (type === "cartao") updateCartoes(prev => prev.filter(c => c.id !== id));
        else if (type === "conta") updateContasBancarias(prev => prev.filter(c => c.id !== id));
        else if (type === "categoria") updateCategorias(prev => prev.filter(c => c.id !== id));
        else if (type === "subcategoria") updateCategorias(prev => prev.map(c => c.id === id ? { ...c, subcategorias: c.subcategorias.filter(s => s.id !== subId) } : c));
        else if (type === "depara") updateDepara(prev => prev.filter(d => d.id !== id));
        setDeleteModal({ open: false, type: null, id: null, subId: null, purchase: null, title: "", message: "" });
      }

      function handleBatchDeleteConfirm(e) {
        e.preventDefault();
        if (batchConfirmText.trim().toUpperCase() !== "EXCLUIR") {
          alert("Digite exatamente EXCLUIR para confirmar.");
          return;
        }
        if (lancamentoTab === "cartao") {
          updatePurchases(prev => prev.filter(p => !selectedCartaoIds.includes(p.id)));
          setSelectedCartaoIds([]);
        } else if (lancamentoTab === "pagar") {
          updateContasPagar(prev => prev.filter(p => !batchPagarIds.includes(p.id)));
          setBatchPagarIds([]);
        } else if (lancamentoTab === "receber") {
          updateContasReceber(prev => prev.filter(p => !batchReceberIds.includes(p.id)));
          setBatchReceberIds([]);
        }
        setBatchConfirmText(""); setBatchDeleteModalOpen(false);
      }

      function toggleSelectAllCartao() {
        if (selectedCartaoIds.length === installmentsForMonth.length) setSelectedCartaoIds([]);
        else setSelectedCartaoIds(installmentsForMonth.map(p => p.id));
      }

      function toggleSelectCartaoItem(id) {
        setSelectedCartaoIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      }

      function toggleSelectAllPagar() {
        if (batchPagarIds.length === contasPagarForMonth.length) setBatchPagarIds([]);
        else setBatchPagarIds(contasPagarForMonth.map(p => p.id));
      }

      function toggleSelectPagarItem(id) {
        setBatchPagarIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      }

      function toggleSelectAllReceber() {
        if (batchReceberIds.length === contasReceberForMonth.length) setBatchReceberIds([]);
        else setBatchReceberIds(contasReceberForMonth.map(p => p.id));
      }

      function toggleSelectReceberItem(id) {
        setBatchReceberIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      }

      function handleSaveLancamento(e) {
        e.preventDefault();
        setFormError("");

        if (editingId) {
          const itemExistente = lancamentoTab === "pagar" ? contasPagar.find(p => p.id === editingId) :
                                lancamentoTab === "receber" ? contasReceber.find(p => p.id === editingId) : null;
          if (itemExistente && itemExistente.status === "Baixado") {
            setFormError("Este lançamento está baixado. Não é permitido fazer alterações em lançamentos baixados.");
            return;
          }
        }

        if (lancamentoTab === "cartao" && isFaturaFechada(faturaMes)) { setFormError("A fatura selecionada está fechada."); return; }
        if (isDiaFechado(dataLancamento)) { setFormError("Este dia está fechado e não aceita novos lançamentos."); return; }
        if (isMesFechado(faturaMes)) { setFormError("Este mês de competência está fechado."); return; }

        const total = parseValorInput(valorTotal);
        const n = parseInt(parcelas, 10);
        const atual = parseInt(parcelaAtual, 10);
        
        if (!descricao.trim() || !categoriaId || !subcategoriaId || !Number.isFinite(total) || total <= 0) {
          setFormError("Preencha todos os campos obrigatórios corretamente.");
          return;
        }

        const competenciaInicial = faturaMes || month || currentMonth();

        const novoRegistro = {
          id: editingId || uid(),
          descricao: descricao.trim(),
          total,
          dataCompra: dataLancamento || currentDate(),
          parcelas: n,
          parcelaInicial: atual,
          inicio: competenciaInicial,
          cartaoId: null,
          categoriaId,
          subcategoriaId,
          status: "Em aberto",
          bancoBaixaId: null,
          dataBaixa: null,
          criadoEm: Date.now()
        };

        if (lancamentoTab === "receber") {
          if (editingId) {
            updateContasReceber(prev => prev.map(p => p.id === editingId ? { ...p, ...novoRegistro, status: p.status, bancoBaixaId: p.bancoBaixaId, dataBaixa: p.dataBaixa } : p));
          } else {
            updateContasReceber(prev => [...prev, novoRegistro]);
          }
        } else if (lancamentoTab === "pagar") {
          if (editingId) {
            updateContasPagar(prev => prev.map(p => p.id === editingId ? { ...p, ...novoRegistro, status: p.status, bancoBaixaId: p.bancoBaixaId, dataBaixa: p.dataBaixa } : p));
          } else {
            updateContasPagar(prev => [...prev, novoRegistro]);
          }
        } else {
          novoRegistro.cartaoId = cartaoId || null;
          if (editingId) {
            updatePurchases(prev => prev.map(p => p.id === editingId ? novoRegistro : p));
          } else {
            updatePurchases(prev => [...prev, novoRegistro]);
          }
        }

        setModalOpen(false);
      }

      function executarBaixaIndividual(type, id, bancoId, dataBaixaStr) {
        if (!bancoId) { alert("Selecione uma conta bancária para efetuar a baixa."); return; }
        if (!dataBaixaStr) { alert("Informe a data da baixa."); return; }
        
        if (isDiaFechado(dataBaixaStr) || isMesFechado(dataBaixaStr.substring(0, 7))) {
          alert("Não é possível realizar a baixa em um dia ou mês que esteja bloqueado/fechado.");
          return;
        }

        if (type === "pagar") {
          updateContasPagar(prev => prev.map(p => p.id === id ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p));
        } else if (type === "receber") {
          updateContasReceber(prev => prev.map(p => p.id === id ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p));
        }
        setBaixaModal({ open: false, type: null, id: null, bancoId: "", dataBaixa: currentDate() });
      }

      function executarBaixaLote(type, bancoId, ids, dataBaixaStr) {
        if (!bancoId) { alert("Selecione uma conta bancária para efetuar a baixa."); return; }
        if (!ids || ids.length === 0) { alert("Nenhum item selecionado."); return; }
        if (!dataBaixaStr) { alert("Informe a data da baixa."); return; }

        if (isDiaFechado(dataBaixaStr) || isMesFechado(dataBaixaStr.substring(0, 7))) {
          alert("Não é possível realizar a baixa em lote em um dia ou mês que esteja bloqueado/fechado.");
          return;
        }

        if (type === "pagar") {
          updateContasPagar(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p));
          setBatchPagarIds([]);
        } else if (type === "receber") {
          updateContasReceber(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p));
          setBatchReceberIds([]);
        }
        setBatchBaixaModal({ open: false, bancoId: "", dataBaixa: currentDate() });
      }

      function executarEstornoBaixa(type, id, dataBaixa) {
        if (dataBaixa && (isDiaFechado(dataBaixa) || isMesFechado(dataBaixa.substring(0, 7)))) {
          alert("Não é possível estornar esta baixa pois o dia ou o mês correspondente encontram-se bloqueados/fechados.");
          return;
        }
        if (!window.confirm("Deseja realmente estornar a baixa deste lançamento?")) return;

        if (type === "pagar") {
          updateContasPagar(prev => prev.map(p => p.id === id ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null } : p));
        } else if (type === "receber") {
          updateContasReceber(prev => prev.map(p => p.id === id ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null } : p));
        }
      }

      function executarEstornoLote(type, ids) {
        if (!ids || ids.length === 0) { alert("Nenhum item selecionado para estorno."); return; }
        
        const listaAlvo = type === "pagar" ? contasPagar : contasReceber;
        for (const id of ids) {
          const item = listaAlvo.find(i => i.id === id);
          if (item && item.dataBaixa) {
            if (isDiaFechado(item.dataBaixa) || isMesFechado(item.dataBaixa.substring(0, 7))) {
              alert(`Estorno cancelado: Há itens na seleção cuja data de baixa (${formatDateBR(item.dataBaixa)}) ou mês está bloqueada.`);
              return;
            }
          }
        }

        if (!window.confirm(`Deseja estornar a baixa dos ${ids.length} itens selecionados?`)) return;

        if (type === "pagar") {
          updateContasPagar(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null } : p));
          setBatchPagarIds([]);
        } else if (type === "receber") {
          updateContasReceber(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null } : p));
          setBatchReceberIds([]);
        }
      }

      const movimentacoesConciliacao = useMemo(() => {
        if (!concilExibido || !concilContaId) return [];
        const lista = [];

        contasPagar.forEach(p => {
          if (p.status === "Baixado" && p.bancoBaixaId === concilContaId && p.dataBaixa) {
            if (p.dataBaixa >= concilDataIni && p.dataBaixa <= concilDataFim) {
              lista.push({ 
                id: p.id, 
                tipoOrigem: 'pagar',
                itemRef: p,
                data: p.dataBaixa, 
                descricao: `Baixa Pagar: ${p.descricao}`, 
                tipo: "Débito", 
                valorDebito: p.valorParcela || p.total, 
                valorCredito: 0 
              });
            }
          }
        });

        contasReceber.forEach(r => {
          if (r.status === "Baixado" && r.bancoBaixaId === concilContaId && r.dataBaixa) {
            if (r.dataBaixa >= concilDataIni && r.dataBaixa <= concilDataFim) {
              lista.push({ 
                id: r.id, 
                tipoOrigem: 'receber',
                itemRef: r,
                data: r.dataBaixa, 
                descricao: `Baixa Receber: ${r.descricao}`, 
                tipo: "Crédito", 
                valorDebito: 0, 
                valorCredito: r.valorParcela || r.total 
              });
            }
          }
        });

        Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
          if (baixa && baixa.status === 'Baixado' && baixa.bancoId === concilContaId && baixa.dataBaixa) {
            if (baixa.dataBaixa >= concilDataIni && baixa.dataBaixa <= concilDataFim) {
              const values = purchases.map(p => {
                const idx = monthDiff(p.inicio, comp);
                const pInicial = p.parcelaInicial || 1;
                const qtdRestante = p.parcelas - pInicial + 1;
                if (idx < 0 || idx >= qtdRestante) return 0;
                const mesesExcluidos = p.mesesExcluidos || [];
                if (mesesExcluidos.includes(comp)) return 0;
                const split = splitInstallments(p.total, p.parcelas);
                return split[(pInicial - 1) + idx];
              });
              const totalComp = values.reduce((s, v) => s + v, 0);
              if (totalComp > 0) {
                lista.push({ 
                  id: `fat-${comp}`, 
                  tipoOrigem: 'fatura',
                  competenciaRef: comp,
                  baixaRef: baixa,
                  data: baixa.dataBaixa, 
                  descricao: `Pagamento Fatura Cartão: ${formatMonthLabel(comp)}`, 
                  tipo: "Débito", 
                  valorDebito: totalComp, 
                  valorCredito: 0 
                });
              }
            }
          }
        });

        lista.sort((a, b) => a.data.localeCompare(b.data));

        let saldoAcumulado = 0;
        return lista.map(item => {
          saldoAcumulado += (item.valorCredito - item.valorDebito);
          return { ...item, saldo: saldoAcumulado };
        });
      }, [concilExibido, concilContaId, concilDataIni, concilDataFim, contasPagar, contasReceber, faturasBaixadas, purchases]);

      const resumoDiarioConcil = useMemo(() => {
        const grupos = {};
        movimentacoesConciliacao.forEach(m => {
          if (!grupos[m.data]) grupos[m.data] = { data: m.data, debitos: 0, creditos: 0, itens: [] };
          grupos[m.data].debitos += m.valorDebito;
          grupos[m.data].creditos += m.valorCredito;
          grupos[m.data].itens.push(m);
        });
        return Object.values(grupos).sort((a, b) => a.data.localeCompare(b.data));
      }, [movimentacoesConciliacao]);

      const totalDebitosConcil = movimentacoesConciliacao.reduce((s, m) => s + m.valorDebito, 0);
      const totalCreditosConcil = movimentacoesConciliacao.reduce((s, m) => s + m.valorCredito, 0);
      const saldoFinalConcil = totalCreditosConcil - totalDebitosConcil;

      const calendarioDiasDoMes = useMemo(() => {
        const [ano, mes] = concilCalMes.split("-").map(Number);
        const ultimoDia = new Date(ano, mes, 0).getDate();
        const dias = [];
        let acumulado = 0;
        for (let d = 1; d <= ultimoDia; d++) {
          const strD = `${ano}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          let deb = 0; let cred = 0;
          if (concilContaId) {
            contasPagar.forEach(p => { if (p.status === "Baixado" && p.bancoBaixaId === concilContaId && p.dataBaixa === strD) deb += (p.valorParcela || p.total); });
            contasReceber.forEach(r => { if (r.status === "Baixado" && r.bancoBaixaId === concilContaId && r.dataBaixa === strD) cred += (r.valorParcela || r.total); });
            Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
              if (baixa && baixa.status === 'Baixado' && baixa.bancoId === concilContaId && baixa.dataBaixa === strD) {
                const values = purchases.map(p => {
                  const idx = monthDiff(p.inicio, comp);
                  const pInicial = p.parcelaInicial || 1;
                  const qtdRestante = p.parcelas - pInicial + 1;
                  if (idx < 0 || idx >= qtdRestante) return 0;
                  const mesesExcluidos = p.mesesExcluidos || [];
                  if (mesesExcluidos.includes(comp)) return 0;
                  const split = splitInstallments(p.total, p.parcelas);
                  return split[(pInicial - 1) + idx];
                });
                deb += values.reduce((s, v) => s + v, 0);
              }
            });
          }
          acumulado += (cred - deb);
          dias.push({ data: strD, diaNum: d, debitos: deb, cred: cred, saldo: acumulado });
        }
        return dias;
      }, [concilCalMes, concilContaId, contasPagar, contasReceber, faturasBaixadas, purchases]);

      const contasPagarFiltradasRelatorio = useMemo(() => {
        return contasPagarForMonth.filter(p => {
          if (relFiltroDataIni && (!p.dataCompra || p.dataCompra < relFiltroDataIni)) return false;
          if (relFiltroDataFim && (!p.dataCompra || p.dataCompra > relFiltroDataFim)) return false;
          if (relFiltroBaixaIni && (!p.dataBaixa || p.dataBaixa < relFiltroBaixaIni)) return false;
          if (relFiltroBaixaFim && (!p.dataBaixa || p.dataBaixa > relFiltroBaixaFim)) return false;
          if (relFiltroStatus !== "todos") {
            const st = p.status || "Em aberto";
            if (relFiltroStatus === "baixado" && st !== "Baixado") return false;
            if (relFiltroStatus === "aberto" && st !== "Em aberto") return false;
          }
          return true;
        });
      }, [contasPagarForMonth, relFiltroDataIni, relFiltroDataFim, relFiltroBaixaIni, relFiltroBaixaFim, relFiltroStatus]);

      const contasReceberFiltradasRelatorio = useMemo(() => {
        return contasReceberForMonth.filter(p => {
          if (relFiltroDataIni && (!p.dataCompra || p.dataCompra < relFiltroDataIni)) return false;
          if (relFiltroDataFim && (!p.dataCompra || p.dataCompra > relFiltroDataFim)) return false;
          if (relFiltroBaixaIni && (!p.dataBaixa || p.dataBaixa < relFiltroBaixaIni)) return false;
          if (relFiltroBaixaFim && (!p.dataBaixa || p.dataBaixa > relFiltroBaixaFim)) return false;
          if (relFiltroStatus !== "todos") {
            const st = p.status || "Em aberto";
            if (relFiltroStatus === "baixado" && st !== "Baixado") return false;
            if (relFiltroStatus === "aberto" && st !== "Em aberto") return false;
          }
          return true;
        });
      }, [contasReceberForMonth, relFiltroDataIni, relFiltroDataFim, relFiltroBaixaIni, relFiltroBaixaFim, relFiltroStatus]);

      const totalMesPagarRelatorio = useMemo(() => contasPagarFiltradasRelatorio.reduce((s, p) => s + p.valorParcela, 0), [contasPagarFiltradasRelatorio]);
      const totalMesReceberRelatorio = useMemo(() => contasReceberFiltradasRelatorio.reduce((s, p) => s + p.valorParcela, 0), [contasReceberFiltradasRelatorio]);

      function exportRelatorioExcel() {
        const lista = relatorioTab === "pagar" ? contasPagarFiltradasRelatorio : contasReceberFiltradasRelatorio;
        if (lista.length === 0) return alert("Sem dados para exportar.");
        let csv = `\uFEFFData;Descrição;Categoria;Parcela;Status;Data Baixa;Valor\n`;
        lista.forEach(p => {
          const cat = getCategoria(p.categoriaId);
          csv += `${formatDateBR(p.dataCompra)};"${p.descricao}";"${cat?.nome || ''}";"${p.index}/${p.parcelas}";"${p.status || 'Em aberto'}";${formatDateBR(p.dataBaixa)};${p.valorParcela.toFixed(2).replace('.', ',')}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `relatorio_${relatorioTab}_${month}.csv`;
        a.click();
      }

      function exportConciliacaoExcel() {
        if (movimentacoesConciliacao.length === 0) return alert("Sem movimentações para exportar.");
        let csv = `\uFEFFData;Descrição;Tipo;Débito;Crédito;Saldo\n`;
        movimentacoesConciliacao.forEach(m => {
          csv += `${formatDateBR(m.data)};"${m.descricao}";"${m.tipo}";${m.valorDebito ? m.valorDebito.toFixed(2).replace('.', ',') : '0,00'};${m.valorCredito ? m.valorCredito.toFixed(2).replace('.', ',') : '0,00'};${m.saldo.toFixed(2).replace('.', ',')}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `conciliacao_${concilContaId}_${concilDataIni}_ate_${concilDataFim}.csv`;
        a.click();
      }

      function exportToExcel() {
        if (installmentsForMonth.length === 0) return alert("Sem lançamentos para exportar.");
        let csv = "\uFEFFData;Descrição;Cartão;Categoria;Subcategoria;Parcela;Valor Parcela;Valor Total\n";
        installmentsForMonth.forEach(p => {
          const cat = getCategoria(p.categoriaId);
          const sub = getSubcategoria(p.categoriaId, p.subcategoriaId);
          const cartao = getCartao(p.cartaoId);
          csv += `${formatDateBR(p.dataCompra)};"${p.descricao}";"${cartao?.nome || ''}";"${cat?.nome || ''}";"${sub?.nome || ''}";"${p.index}/${p.parcelas}";${p.valorParcela.toFixed(2).replace('.', ',')};${p.total.toFixed(2).replace('.', ',')}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `fatura_${month}.csv`;
        a.click();
      }

      function exportToPDF() {
        if (installmentsForMonth.length === 0 && contasPagarForMonth.length === 0 && contasReceberForMonth.length === 0 && movimentacoesConciliacao.length === 0) return alert("Sem dados para imprimir.");
        window.print();
      }

      if (authLoading) {
        return h('div', { style: { textAlign: 'center', padding: '50px', fontFamily: 'sans-serif' } }, "Carregando sistema...");
      }

      if (!session) {
        return h('div', { className: 'fatura-app', style: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: 'var(--paper)' } },
          h('div', { className: 'form-card', style: { width: '100%', maxWidth: '420px', padding: '36px', boxShadow: '0 4px 16px rgba(0,0,0,0.06)', borderRadius: '8px' } },
            h('div', { style: { textAlign: 'center', marginBottom: '28px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '20px', fontWeight: 'bold', color: 'var(--ink)' } },
              h(Lock, { size: 22 }), " Acesso Restrito"
            ),
            h('form', { onSubmit: handleLogin, style: { display: 'flex', flexDirection: 'column', gap: '16px' } },
              h('div', { className: 'field' },
                h('label', null, "E-mail"),
                h('input', { type: 'email', value: authEmail, onChange: e => setAuthEmail(e.target.value), placeholder: '', required: true })
              ),
              h('div', { className: 'field' },
                h('label', null, "Senha"),
                h('input', { type: 'password', value: authPassword, onChange: e => setAuthPassword(e.target.value), placeholder: '', required: true })
              ),
              authError && h('div', { style: { color: 'var(--red)', fontSize: '13px', background: 'var(--red-soft)', padding: '8px 12px', borderRadius: '4px' } }, authError),
              h('button', { type: 'submit', className: 'primary', style: { justifyContent: 'center', marginTop: '10px', padding: '12px', background: '#223825', fontWeight: 'bold', fontSize: '15px' } }, "Entrar")
            )
          )
        );
      }

      if (dataLoading) {
        return h('div', { style: { textAlign: 'center', padding: '50px', fontFamily: 'sans-serif' } }, "Sincronizando dados da nuvem...");
      }

      return h('div', { className: 'fatura-app-layout' },
        h('style', null, `
          .fatura-app-layout { --paper: #ECE8DD; --card: #FAF8F2; --ink: #262117; --ink-soft: #6B6355; --line: #D8D0BC; --green: #2F5233; --red: #8C3B2E; --red-soft: #F1E4DF; --amber: #D97706; --amber-soft: #FEF3C7; font-family: sans-serif; color: var(--ink); display: flex; min-height: 100vh; background-color: var(--paper); }
          
          .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 16px; flex-shrink: 0; justify-content: space-between; }

          .sidebar-nav button:hover { background: var(--paper); color: var(--ink); }
          .sidebar-nav button.active { background: var(--green); color: #fff; font-weight: 600; }
          .sidebar-footer { border-top: 1px solid var(--line); padding-top: 16px; }

          .main-content { flex: 1; padding: 24px; overflow-y: auto; max-width: 1100px; }

          .fatura-app * { box-sizing: border-box; }
          .num { font-family: monospace; }

          .brand { display: flex; align-items: center; justify-content: space-between; color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }

          th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); font-size: 13px; text-align: left; }

          th.center, td.center { text-align: center; }
          .badge { font-size: 11px; padding: 2px 6px; background: var(--paper); border-radius: 4px; color: var(--ink-soft); white-space: nowrap; }

          .badge.aberto { background: #FEF3C7; color: #92400E; }
          .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
          
          .lock-btn { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 5px; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
          .lock-btn.closed { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
          
          .action-btn { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; }
          .action-btn:hover { border-color: var(--ink); color: var(--ink); }
          .action-btn.delete:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }

          .modal-content { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
          .modal-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
          .field { display: flex; flex-direction: column; gap: 4px; width: 100%; }
          .field.full { grid-column: span 2; }
          label { font-size: 12px; color: var(--ink-soft); }
          input, select, textarea { font-family: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; width: 100%; box-sizing: border-box; }
          .submit-row { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-wrap: wrap; gap: 8px; }
          
          button.primary { background: var(--green); color: #fff; border: none; border-radius: 5px; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
          button.danger { background: var(--red); color: #fff; border: none; border-radius: 5px; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
          
          .purchase-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
          button.icon { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px; }
          .color-swatches { display: flex; gap: 6px; }
          .color-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
          .color-swatch.selected { border-color: var(--ink); }
          
          .list-vertical { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
          .list-item { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 12px; transition: background 0.2s; }
          .list-item.clickable { cursor: pointer; }
          .list-item.clickable:hover { background: var(--paper); }
          .list-item-main { display: flex; align-items: center; justify-content: space-between; font-weight: 500; font-size: 15px; }
          .subcategory-item-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink); padding: 4px 0; border-bottom: 1px dashed var(--line); }
          .add-subcat-form { display: flex; gap: 8px; margin-top: 8px; padding-left: 16px; }

          /* Caixa de Alerta Lançamentos Terminando */
          .warning-box { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
          .warning-box-title { font-weight: bold; color: #92400E; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
          .warning-box ul { margin: 0; padding-left: 20px; color: #92400E; font-size: 13px; }
          .warning-box li { margin-bottom: 4px; }

            .sidebar, .form-card > div:first-child, .export-buttons, button, .sub-nav, .nav-month, .warning-box { display: none !important; }

            .top, .form-card { border: none !important; background: #fff !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
          }

                h('button', { type: 'submit', className: 'primary' }, "Salvar")
              )
            )
          )
        ),

        batchDeleteModalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-content', onClick: e => e.stopPropagation(), style: { maxWidth: 380 } },
            h('div', { style: { fontSize: 16, fontWeight: 'bold', marginBottom: 8, color: 'var(--red)' } }, "Excluir em Lote"),
            h('div', { style: { fontSize: 13, marginBottom: 14 } }, "Digite ", h('b', null, "EXCLUIR"), ` para apagar os itens selecionados:`),
            h('form', { onSubmit: handleBatchDeleteConfirm, style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              h('input', { type: 'text', placeholder: 'EXCLUIR', value: batchConfirmText, onChange: e => setBatchConfirmText(e.target.value), required: true }),
              h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8 } },
                h('button', { type: 'button', className: 'action-btn', onClick: () => { setBatchDeleteModalOpen(false); setBatchConfirmText(""); } }, "Cancelar"),
                h('button', { type: 'submit', className: 'danger' }, "Confirmar")
              )
            )
          )
        ),

        deleteModal.open && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-content', onClick: e => e.stopPropagation(), style: { maxWidth: 380 } },
            h('div', { style: { fontSize: 16, fontWeight: 'bold', marginBottom: 8 } }, deleteModal.title),
            h('div', { style: { fontSize: 13, marginBottom: 14 } }, deleteModal.message || "Tem certeza que deseja excluir?"),
            h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, flexWrap: 'wrap' } },
              h('button', { type: 'button', className: 'action-btn', onClick: () => setDeleteModal({ open: false, type: null, id: null, subId: null, purchase: null, title: "", message: "" }) }, "Cancelar"),
              deleteModal.message && deleteModal.message.includes("ERRO") ? null :
              h('button', { type: 'button', className: 'danger', onClick: () => handleConfirmDelete('all') }, "Excluir")
            )
          )
        ),

        cartaoModalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-content', onClick: e => e.stopPropagation(), style: { maxWidth: 380 } },
            h('div', { style: { fontSize: 16, fontWeight: 'bold', marginBottom: 12 } }, editingCartaoId ? "Editar Cartão" : "Novo Cartão"),
            h('form', { onSubmit: handleSaveCartao, style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              h('div', { className: 'field' }, h('label', null, "Nome *"), h('input', { type: 'text', value: novoCartaoNome, onChange: e => setNovoCartaoNome(e.target.value), required: true })),
              h('div', { className: 'field' }, h('label', null, "Banco"), h('select', { value: novoCartaoBanco, onChange: e => setNovoCartaoBanco(e.target.value) }, BANCOS_FEBRABAN.map(b => h('option', { key: b.code, value: b.code }, b.name)))),
              h('div', { className: 'field' }, h('label', null, "Cor"), h('div', { className: 'color-swatches' }, CARD_COLORS.map(cor => h('button', { type: 'button', key: cor, className: `color-swatch ${novoCartaoCor === cor ? 'selected' : ''}`, style: { background: cor }, onClick: () => setNovoCartaoCor(cor) })))),
              cartaoError && h('div', { style: { color: 'var(--red)', fontSize: 12 } }, cartaoError),
              h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 10 } },
                h('button', { type: 'button', className: 'action-btn', onClick: () => setCartaoModalOpen(false) }, "Cancelar"),
                h('button', { type: 'submit', className: 'primary' }, "Salvar")
              )
            )
          )
        ),

        contaModalOpen && h('div', { className: 'modal-overlay' },
          h('div', { className: 'modal-content', onClick: e => e.stopPropagation(), style: { maxWidth: 420 } },
            h('div', { style: { fontSize: 16, fontWeight: 'bold', marginBottom: 12 } }, editingContaId ? "Editar Conta" : "Nova Conta"),
            h('form', { onSubmit: handleSaveConta, style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              h('div', { className: 'field' }, h('label', null, "Nome da Conta *"), h('input', { type: 'text', value: novaContaNome, onChange: e => setNovaContaNome(e.target.value), placeholder: 'Ex: Caixa Principal, Conta PJ Santander', required: true })),
              h('div', { className: 'field' }, h('label', null, "Banco *"), h('select', { value: novaContaBanco, onChange: e => setNovaContaBanco(e.target.value) }, BANCOS_FEBRABAN.map(b => h('option', { key: b.code, value: b.code }, b.name)))),
              h('div', { className: 'field' },
                h('label', null, "Categoria / Tipo de Conta *"),
                h('select', { value: novaContaTipo, onChange: e => setNovaContaTipo(e.target.value) },
                  h('option', { value: "corrente" }, "Conta Corrente"),
                  h('option', { value: "investimento" }, "Conta Investimento"),
                  h('option', { value: "dinheiro" }, "Dinheiro / Caixa Físico"),
                  h('option', { value: "outros" }, "Outros")
                )
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 } },
                h('div', { className: 'field' }, h('label', null, "Número da Agência"), h('input', { type: 'text', value: novaContaAgencia, onChange: e => setNovaContaAgencia(e.target.value), placeholder: 'Ex: 1234' })),
                h('div', { className: 'field' }, h('label', null, "Número da Conta"), h('input', { type: 'text', value: novaContaNumero, onChange: e => setNovaContaNumero(e.target.value), placeholder: 'Ex: 56789-0' }))
              ),
              contaError && h('div', { style: { color: 'var(--red)', fontSize: 12 } }, contaError),
              h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 10 } },
                h('button', { type: 'button', className: 'action-btn', onClick: () => setContaModalOpen(false) }, "Cancelar"),
                h('button', { type: 'submit', className: 'primary' }, "Salvar")
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(FaturaApp));
  </script>
</body>
</html>

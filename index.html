    function splitInstallments(total, n) {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      let remainder = totalCents - base * n;
      const result = [];
      for (let i = 0; i < n; i++) {
        let val = base;
        if (remainder > 0) { val += 1; remainder -= 1; }
        result.push(val / 100);
      }
      return result;
    }

    function addMonths(yyyymm, delta) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthDiff(fromYYYYMM, toYYYYMM) {
      const f = fromYYYYMM.split("-").map(Number);
      const t = toYYYYMM.split("-").map(Number);
      return (t[0] - f[0]) * 12 + (t[1] - f[1]);
    }

    function formatMonthLabel(yyyymm) {
      const parts = yyyymm.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, 1);
      const label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function formatDateBR(dateString) {
      if (!dateString) return "";
      const parts = dateString.split("-");
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatBRL(v) {
      return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

          const mesesExcluidos = p.mesesExcluidos || [];
          if (mesesExcluidos.includes(month)) return null;

          const values = splitInstallments(p.total, p.parcelas);
          const numeroParcela = pInicial + idx;
          return { ...p, index: numeroParcela, valorParcela: values[numeroParcela - 1] };
        }).filter(Boolean).sort((a, b) => b.valorParcela - a.valorParcela);
      }, [purchases, month]);

          const pInicial = p.parcelaInicial || 1;

          if (idx < 0 || idx >= qtdRestante) return null;
          const values = splitInstallments(p.total, p.parcelas);
          const numeroParcela = pInicial + idx;
          return { ...p, index: numeroParcela, valorParcela: values[numeroParcela - 1] };
        }).filter(Boolean).sort((a, b) => b.valorParcela - a.valorParcela);
      }, [contasPagar, month]);

      async function handlePDFImport(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (isFaturaFechada(month)) {
          alert("A fatura deste mês está fechada. Abra a fatura antes de importar novos lançamentos.");
          if (fileInputRef.current) fileInputRef.current.value = "";
          return;
        }

        setIsImportingPDF(true);
        try {
          const arrayBuffer = await file.arrayBuffer();
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          const pdfDoc = await loadingTask.promise;
          
          let fullTextLines = [];
          for (let i = 1; i <= pdfDoc.numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const textContent = await page.getTextContent();
            textContent.items.forEach(item => {
              if (item.str && item.str.trim()) fullTextLines.push(item.str.trim());
            });
          }

          const novasCompras = [];
          let itensIgnoradosSemDepara = 0;
          const currentYear = month.split("-")[0];
          const cartaoSantander = cartoes.find(c => c.bancoCode === "033") || cartoes[0];
          const defaultCartaoId = cartaoSantander ? cartaoSantander.id : null;

          let i = 0;
          while (i < fullTextLines.length) {
            const line = fullTextLines[i];
            const dateMatch = line.match(/^(\d{2})\/(\d{2})$/);
            if (dateMatch) {
              const dia = dateMatch[1];
              const mes = dateMatch[2];
              const dataCompra = `${currentYear}-${mes}-${dia}`;
              
              let descParts = [];
              let valorEncontrado = null;
              let parcelaAtualNum = 1;
              let totalParcelasNum = 1;

              let j = i + 1;
              let foundVal = false;
              while (j < Math.min(i + 6, fullTextLines.length)) {
                const nextLine = fullTextLines[j];
                const valMatch = nextLine.match(/^-?([\d]{1,3}(\.[\d]{3})*|\d+),(\d{2})$/);
                if (valMatch) {
                  valorEncontrado = parseValorInput(nextLine);
                  foundVal = true;
                  i = j;
                  break;
                } else {
                  const parcMatch = nextLine.match(/^(\d{2})\/(\d{2})$/);
                  if (parcMatch) {
                    parcelaAtualNum = parseInt(parcMatch[1], 10);
                    totalParcelasNum = parseInt(parcMatch[2], 10);
                  } else {
                    descParts.push(nextLine);
                  }
                }
                j++;
              }

              if (foundVal && valorEncontrado !== null && valorEncontrado > 0) {
                const rawDesc = descParts.join(" ").trim() || "Compra Importada Santander";
                const regra = buscarRegraDepara(rawDesc);
                
                if (regra.encontrado && regra.categoriaId && regra.subcategoriaId) {
                  const inicioCompetencia = addMonths(month, -(parcelaAtualNum - 1));
                  novasCompras.push({
                    id: uid(),
                    descricao: regra.descricao,
                    total: valorEncontrado * totalParcelasNum,
                    dataCompra: dataCompra,
                    parcelas: totalParcelasNum,
                    parcelaInicial: 1,
                    inicio: inicioCompetencia,
                    cartaoId: defaultCartaoId,
                    categoriaId: regra.categoriaId,
                    subcategoriaId: regra.subcategoriaId,
                    criadoEm: Date.now()
                  });
                } else {
                  itensIgnoradosSemDepara++;
                }
              }
            }
            i++;
          }

          if (novasCompras.length > 0) {
            updatePurchases(prev => [...prev, ...novasCompras]);
            let msg = `Sucesso! Foram importados ${novasCompras.length} lançamentos via De-Para.`;
            if (itensIgnoradosSemDepara > 0) msg += ` ${itensIgnoradosSemDepara} item(ns) ignorados por falta de regra De-Para cadastrada.`;
            alert(msg);
          } else {
            alert(`Nenhum lançamento importado. ${itensIgnoradosSemDepara > 0 ? `${itensIgnoradosSemDepara} itens encontrados na fatura não possuem regra De-Para válida cadastrada.` : 'Nenhum item válido encontrado.'}`);
          }
        } catch (err) {
          console.error(err);
          alert("Erro ao ler o arquivo PDF.");
        } finally {
          setIsImportingPDF(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
        }
      }

      async function handlePlanilhaImport(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (isFaturaFechada(month)) {
          alert("A fatura deste mês está fechada. Abra a fatura antes de importar novos lançamentos.");
          if (planilhaInputRef.current) planilhaInputRef.current.value = "";
          return;
        }

        setIsImportingPlanilha(true);
        try {
          const text = await file.text();
          const lines = text.split("\n");
          if (lines.length <= 1) {
            alert("O arquivo CSV/Planilha está vazio ou em formato inválido.");
            return;
          }

          const header = lines[0];
          const separator = header.includes(";") ? ";" : ",";

          const novasCompras = [];
          const currentYear = month.split("-")[0];
          const defaultCartaoId = cartoes[0] ? cartoes[0].id : null;

          for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const cols = line.split(separator).map(c => c.replace(/^["']|["']$/g, "").trim());
            if (cols.length < 2) continue;

            const dataStr = cols[0] || `${currentYear}-01-01`;
            let dataIso = currentDate();
            if (dataStr.includes("/")) {
              const pData = dataStr.split("/");
              if (pData.length === 3) dataIso = `${pData[2]}-${pData[1]}-${pData[0]}`;
            }

            const descricaoItem = cols[1] || "Lançamento Importado";
            const parcelaStr = cols[5] || "1/1";
            const pParts = parcelaStr.split("/");
            const parcelaAtualNum = parseInt(pParts[0], 10) || 1;
            const totalParcelasNum = parseInt(pParts[1], 10) || 1;

            const valorTotalNum = parseValorInput(cols[7]) || (parseValorInput(cols[6]) * totalParcelasNum) || 0;

            if (valorTotalNum > 0) {
              const regra = buscarRegraDepara(descricaoItem);
              const primeiraCatDespesa = categorias.find(c => c.tipo !== 'receita');
              const catFinal = regra.encontrado ? regra.categoriaId : (primeiraCatDespesa ? primeiraCatDespesa.id : null);
              const subFinal = regra.encontrado ? regra.subcategoriaId : (primeiraCatDespesa?.subcategorias[0] ? primeiraCatDespesa.subcategorias[0].id : null);
              const descFinal = regra.encontrado ? regra.descricao : descricaoItem;

              const inicioCompetencia = addMonths(month, -(parcelaAtualNum - 1));

              if (catFinal && subFinal) {
                novasCompras.push({
                  id: uid(),
                  descricao: descFinal,
                  total: valorTotalNum,
                  dataCompra: dataIso,
                  parcelas: totalParcelasNum,
                  parcelaInicial: 1,
                  inicio: inicioCompetencia,
                  cartaoId: defaultCartaoId,
                  categoriaId: catFinal,
                  subcategoriaId: subFinal,
                  criadoEm: Date.now()
                });
              }
            }
          }

          if (novasCompras.length > 0) {
            updatePurchases(prev => [...prev, ...novasCompras]);
            alert(`Sucesso! Foram importados ${novasCompras.length} lançamentos da planilha.`);
          } else {
            alert("Nenhum lançamento válido foi encontrado na planilha.");
          }
        } catch (err) {
          console.error(err);
          alert("Erro ao ler o arquivo de planilha.");
